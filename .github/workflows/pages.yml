name: pages

# Manual until launch.
#
# GitHub Pages is not enabled on this repository, and Pages for a private repo
# needs a paid plan, so an automatic run on every push would render all 24
# formats for ~12 minutes and then fail at the deploy step — leaving the repo
# permanently red for a reason that is not a defect.
#
# At launch: make the repo public, set Settings -> Pages -> Source to
# "GitHub Actions", then add the `push` trigger back:
#
#   on:
#     push:
#       branches: [main]
#     workflow_dispatch:
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Cache Inter
        uses: actions/cache@v4
        with:
          path: engine/assets/fonts
          key: inter-4.1-${{ hashFiles('engine/src/fonts.ts') }}

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - run: npm run setup

      # The gallery is the product, so the previews it shows are rendered fresh
      # from the specs on every deploy rather than committed as binaries.
      - name: Render every format
        run: npx kw render --all

      - name: Build the gallery
        run: npx kw site build

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
