name: pages

# Deploys the gallery on every push to main.
#
# This costs seconds rather than the ten minutes it once did: the previews are
# committed, so a deploy copies files and builds one JSON instead of rendering
# 24 clips. `kw previews check` runs first, so a deploy cannot publish a preview
# whose spec has moved since it was rendered.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # The previews are committed, so a deploy copies rather than renders —
      # seconds instead of the ten minutes rendering all 24 used to cost. The
      # drift check in ci.yml is what keeps that safe.
      - name: Committed previews match their specs
        run: npx kw previews check

      - name: Build the gallery
        run: npx kw site build

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
