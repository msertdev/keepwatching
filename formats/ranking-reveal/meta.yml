name: "Ranking — top down"
family: ranking
hypothesis: >-
  Showing rank 1 immediately trades suspense for clarity: the viewer learns the answer in the first two seconds and stays only if the rest of the list surprises them.
useWhen: >-
  The headline is the ranking itself and you want shares over watch-through.
avoidWhen: >-
  You are optimising for completion — this format gives away its own ending.
sampleContent: sourced
sources:
  - title: "NASA — Planetary Fact Sheet"
    url: https://nssdc.gsfc.nasa.gov/planetary/factsheet/
    claim: "Equatorial diameters: Jupiter 139,820 km, Saturn 116,460 km, Uranus 50,724 km, Neptune 49,244 km, Earth 12,742 km."
tags:
  - "list"
  - "ranking"
  - "shareable"
inputs:
  - key: title
    description: "What is being ranked."
