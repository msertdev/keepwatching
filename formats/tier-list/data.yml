# Evidence for this format. Written by `kw measure apply` — never by hand.
#
# Two blocks, deliberately separate:
#   format:       how this SCENE STRUCTURE performed. Only this block ranks the library.
#   content_axis: how the SUBJECT MATTER performed, carried by this format.
#
# They are never averaged together. One published video carries both labels, so
# combining them would produce a number that answers neither question.
# n: 0 means untested. That is a valid, honest state — do not fill it in.
format:
  n: 0
  status: untested
  platforms: []
  hook3s: null
  avgViewedPct: null
  viewsPerHour: null
  vsBaselinePct: null
  retention: []
  samples: []
content_axis:
  n: 0
  status: untested
  axes: []
