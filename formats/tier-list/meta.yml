name: "Tier list"
family: ranking
hypothesis: >-
  Tier labels invite disagreement, and a viewer composing an objection in their head watches to the end to check whether their pick was ranked.
useWhen: >-
  The audience has strong opinions and a comment section worth provoking.
avoidWhen: >-
  The subject is factual — tiers imply judgement the data may not support.
sampleContent: placeholder
# The example copy in format.json is deliberate filler. Replace the `data`
# block with your own content — and if it contains a real number, add a
# sources: list and switch sampleContent to "sourced".
tags:
  - "list"
  - "opinion"
  - "comments"
inputs:
  - key: title
    description: "What is being tiered."
